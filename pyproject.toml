[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datewithme"
version = "1.4.9"
description = "Private, self-hosted date invitations and activity planning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["self-hosted", "invitations", "fastapi", "date-planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app"]
